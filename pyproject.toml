[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "footagepilot"
version = "0.1.0"
description = "Local video editing with reviewable edits and verification evidence"
requires-python = ">=3.11"

[project.scripts]
footagepilot = "footagepilot.__main__:main"

[tool.setuptools.package-data]
footagepilot = ["web/*.html", "render/*.jsx", "*.lua"]

[tool.setuptools.packages.find]
include = ["footagepilot", "footagepilot.*"]
